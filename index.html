<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#D4A843">
<link rel="manifest" href="manifest.json">
<title>Mi Entrenamiento</title>
<style>
:root{--gold:#D4A843;--gold2:#F0C96A;--red:#e74c3c;--blue:#5B9BD5;--purple:#c39bd3;--green:#4CAF50;--bg:#080808;--s1:#111;--s2:#181818;--s3:#222;--s4:#2A2A2A;--text:#E8E0D0;--muted:#888;--dim:#444;--nav-h:60px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{padding-bottom:var(--nav-h);overflow-y:auto;}
.hidden{display:none!important;}
#nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:#0D0D0D;border-top:1px solid var(--s4);display:flex;z-index:200;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 0;}
.nb .ic{font-size:22px;}
.nb.active{color:var(--gold);}
.pg-hdr{background:var(--s1);border-bottom:2px solid var(--gold);padding:16px 16px 12px;position:sticky;top:0;z-index:50;}
.pg-hdr h1{font-size:22px;font-weight:900;letter-spacing:1px;color:#fff;}
.pg-hdr h1 span{color:var(--gold);}
.pg-hdr p{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:2px;text-transform:uppercase;}
.bdg{display:inline-block;font-size:9px;font-weight:800;letter-spacing:2px;padding:3px 8px;text-transform:uppercase;}
.bdg.FUERZA{background:rgba(231,76,60,.18);color:var(--red);}
.bdg.HIPERTROFIA{background:rgba(91,155,213,.18);color:var(--blue);}
.bdg.PEAK{background:rgba(212,168,67,.18);color:var(--gold);}
.bdg.DELOAD{background:rgba(100,100,100,.18);color:#888;}
.bdg.TESTORM{background:rgba(76,175,80,.18);color:var(--green);}
.sess-hdr{padding:14px 16px 12px;background:var(--s2);border-bottom:1px solid var(--s4);}
.sess-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.sess-title{font-size:26px;font-weight:900;color:#fff;}
.sess-focus{font-size:11px;color:var(--muted);}
.sess-info{display:flex;gap:10px;margin-top:6px;}
.chip{font-size:10px;color:var(--dim);background:var(--s3);padding:3px 8px;}
.sec-lbl{font-size:9px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;padding:10px 16px 7px;background:rgba(212,168,67,.04);border-bottom:1px solid rgba(212,168,67,.08);}
.bl{padding:14px 16px;border-bottom:1px solid var(--s4);}
.bl-top{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.bl-nm{font-size:14px;font-weight:700;color:#fff;}
.bl-nt{font-size:11px;color:var(--dim);}
.bl-tr{display:flex;align-items:baseline;gap:4px;margin-bottom:2px;}
.bl-kg{font-size:42px;font-weight:900;line-height:1;}
.bl-sc{font-size:13px;color:var(--muted);}
.bl-pc{font-size:10px;color:var(--dim);margin-bottom:10px;}
.bl-row{display:flex;align-items:center;gap:10px;}
.bl-grp{display:flex;flex-direction:column;gap:3px;}
.bl-grp label{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
.bl-in{background:var(--s3);border:1px solid var(--s4);color:#fff;padding:10px 8px;width:82px;font-size:19px;text-align:center;border-radius:4px;outline:none;-webkit-appearance:none;}
.bl-in:focus{border-color:var(--gold);}
.bl-x{font-size:16px;color:var(--dim);margin-top:14px;}
.bl-pv{font-size:11px;font-weight:700;margin-top:7px;}
.bl-tbtn{margin-top:10px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);color:var(--gold);font-size:10px;letter-spacing:1px;cursor:pointer;border-radius:4px;width:fit-content;}
.ex-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--s4);gap:10px;}
.ex-inf{flex:1;}
.ex-nm{font-size:13px;font-weight:600;color:var(--text);}
.ex-sb{font-size:11px;color:var(--dim);margin-top:2px;}
.t-btn{font-size:10px;color:var(--dim);padding:4px 8px;background:var(--s3);border:none;cursor:pointer;border-radius:3px;flex-shrink:0;}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--s4);background:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.chk.on{border-color:var(--green);background:rgba(76,175,80,.15);color:var(--green);}
.cb-hdr{padding:9px 16px 7px;background:rgba(155,89,182,.07);border-top:1px solid rgba(155,89,182,.15);border-bottom:1px solid rgba(155,89,182,.08);}
.cb-t{font-size:10px;font-weight:700;color:var(--purple);letter-spacing:2px;text-transform:uppercase;}
.done-bar{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(76,175,80,.07);border-top:1px solid rgba(76,175,80,.2);}
.rest-bar{background:rgba(60,60,60,.07);border-top:1px solid var(--s4);}
.done-t{font-size:12px;font-weight:700;color:var(--green);}
.rest-t{font-size:12px;font-weight:700;color:var(--dim);}
.btn-ed{background:none;border:1px solid var(--s4);color:var(--muted);padding:7px 13px;font-size:10px;letter-spacing:1px;cursor:pointer;border-radius:4px;}
#action-bar{position:fixed;bottom:var(--nav-h);left:0;right:0;background:#0D0D0D;border-top:1px solid var(--s4);padding:10px 14px;display:flex;gap:10px;z-index:100;}
.btn-rest{flex:1;padding:14px;background:none;border:1px solid var(--s4);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:6px;}
.btn-done{flex:2;padding:14px;background:var(--gold);border:none;color:#080808;font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:6px;}
.btn-done:active{transform:scale(.98);}
.no-sess{padding:48px 24px;text-align:center;}
.no-sess .big{font-size:56px;margin-bottom:16px;}
.no-sess h2{font-size:22px;color:var(--gold);margin-bottom:10px;}
.no-sess p{font-size:13px;color:var(--muted);line-height:1.7;}
.cycle-banner{margin:14px 16px;background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.3);padding:16px;border-radius:8px;text-align:center;}
.cb-title{font-size:22px;font-weight:900;color:var(--green);letter-spacing:1px;}
.cb-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
.cb-btn{margin-top:14px;padding:12px 24px;background:var(--green);border:none;color:#080808;font-size:14px;font-weight:900;letter-spacing:2px;cursor:pointer;border-radius:6px;}
#notif-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;}
.notif-box{background:var(--s1);border:2px solid var(--gold);border-radius:16px;padding:28px 22px 20px;width:100%;max-width:340px;position:relative;}
.notif-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;}
.notif-em{font-size:52px;text-align:center;margin-bottom:14px;line-height:1;}
.notif-msg{font-size:20px;font-weight:900;letter-spacing:1px;text-align:center;color:#fff;line-height:1.2;margin-bottom:6px;}
.notif-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5;white-space:pre-line;}
.notif-btns{display:flex;gap:10px;}
.n-rest{flex:1;padding:12px;background:none;border:1px solid var(--s4);color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:8px;}
.n-go{flex:2;padding:12px;background:var(--gold);border:none;color:#080808;font-size:16px;font-weight:900;cursor:pointer;border-radius:8px;}
#timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.t-lbl{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px;}
.t-ring{position:relative;width:200px;height:200px;margin-bottom:20px;}
.t-ring svg{transform:rotate(-90deg);}
.t-ring circle{fill:none;stroke-width:8;}
.t-bg{stroke:var(--s4);}
.t-fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .9s linear;}
.t-done{stroke:var(--green);}
.t-digits{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:#fff;letter-spacing:2px;}
.t-presets{display:flex;gap:10px;margin-bottom:24px;}
.t-preset{background:var(--s3);border:1px solid var(--s4);color:var(--muted);padding:10px 16px;font-size:12px;letter-spacing:1px;cursor:pointer;border-radius:6px;}
.t-preset.active{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,.1);}
.t-close{background:none;border:1px solid var(--s4);color:var(--muted);padding:12px 28px;font-size:11px;letter-spacing:2px;cursor:pointer;border-radius:6px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--s2);border-bottom:1px solid var(--s4);}
.cal-title{font-size:20px;font-weight:900;color:#fff;text-align:center;}
.cal-sub{font-size:10px;color:var(--muted);text-align:center;margin-top:1px;}
.cal-arr{background:none;border:1px solid var(--s4);color:var(--muted);width:36px;height:36px;font-size:20px;cursor:pointer;border-radius:4px;}
.cal-arr:disabled{opacity:.2;cursor:default;}
.cal-mode{display:flex;margin:10px 16px 0;background:var(--s3);border-radius:6px;overflow:hidden;}
.cal-mode button{flex:1;padding:8px;background:none;border:none;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);cursor:pointer;}
.cal-mode button.active{background:var(--gold);color:#080808;}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 10px 4px;gap:2px;}
.cal-dow span{text-align:center;font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 10px;gap:2px;}
.cal-day{min-height:44px;padding:5px 4px 3px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:6px;}
.cal-day:active{background:var(--s3);}
.cal-dn{font-size:12px;color:var(--muted);line-height:1.2;margin-bottom:3px;}
.cal-day.today .cal-dn{background:var(--gold);color:#080808;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.cal-day.other .cal-dn{color:var(--s4);}
.cal-dot{width:7px;height:7px;border-radius:50%;margin-top:1px;}
.dot-FUERZA{background:var(--red);}
.dot-HIPERTROFIA{background:var(--blue);}
.dot-PEAK{background:var(--gold);}
.dot-DELOAD{background:#666;}
.dot-TESTORM{background:var(--green);}
.dot-rest{background:var(--s4);}
.dot-cali{background:var(--purple);}
.yr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 16px;}
.yr-m{background:var(--s2);border:1px solid var(--s4);padding:8px;}
.yr-mt{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;text-align:center;}
.yr-mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.yr-c{width:100%;aspect-ratio:1;border-radius:2px;background:var(--s4);}
.yr-c.trained{background:var(--gold);opacity:.8;}
.yr-c.today-c{background:var(--gold);box-shadow:0 0 4px var(--gold);}
#dp-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;display:none;}
#dp{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:2px solid var(--gold);padding:20px 16px 80px;z-index:300;transform:translateY(100%);transition:transform .25s;border-radius:14px 14px 0 0;}
#dp.open{transform:translateY(0);}
.dp-drag{width:40px;height:4px;background:var(--s4);border-radius:2px;margin:0 auto 14px;}
.dp-date{font-size:20px;font-weight:900;color:#fff;margin-bottom:4px;}
.dp-empty{font-size:13px;color:var(--dim);margin-top:8px;}
.dp-s{background:var(--s2);padding:12px 14px;margin-top:10px;border-left:3px solid var(--gold);}
.dp-sn{font-size:14px;font-weight:700;color:#fff;}
.dp-ss{font-size:11px;color:var(--muted);margin-top:3px;}
.dp-close{width:100%;padding:12px;background:none;border:1px solid var(--s4);color:var(--muted);font-size:10px;letter-spacing:2px;cursor:pointer;border-radius:6px;margin-top:14px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;}
.stat{background:var(--s2);padding:12px 8px;border-radius:6px;text-align:center;}
.stat-v{font-size:28px;font-weight:900;color:var(--gold);}
.stat-l{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.orm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px;}
.orm-c{background:var(--s2);padding:10px 12px;border-radius:6px;border-left:3px solid var(--dim);}
.orm-c[data-l=squat]{border-color:var(--red);}
.orm-c[data-l=deadlift]{border-color:var(--gold);}
.orm-c[data-l=bench]{border-color:var(--blue);}
.orm-c[data-l=ohp]{border-color:var(--purple);}
.orm-l{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.orm-v{font-size:26px;font-weight:900;}
.orm-c[data-l=squat] .orm-v{color:var(--red);}
.orm-c[data-l=deadlift] .orm-v{color:var(--gold);}
.orm-c[data-l=bench] .orm-v{color:var(--blue);}
.orm-c[data-l=ohp] .orm-v{color:var(--purple);}
.orm-sb{font-size:9px;color:var(--dim);}
.sec-t{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;padding:12px 16px 8px;}
.cyc-sel{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;}
.cyc-sel::-webkit-scrollbar{display:none;}
.cyc-btn{font-size:10px;padding:6px 14px;border:1px solid var(--s4);background:none;color:var(--dim);cursor:pointer;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.cyc-btn.active{border-color:var(--gold);color:var(--gold);}
.ptbl-w{padding:0 16px 16px;overflow-x:auto;}
.ptbl{width:100%;border-collapse:collapse;font-size:12px;}
.ptbl th{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:7px 8px;text-align:left;background:var(--s2);border-bottom:1px solid var(--s4);white-space:nowrap;}
.ptbl td{padding:8px 8px;border-bottom:1px solid #141414;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--dim);}
.ptbl tr.cur td{background:rgba(212,168,67,.05);color:#fff;}
.ptbl tr.done td{color:var(--muted);}
.info-bar{margin:0 16px 14px;background:rgba(212,168,67,.05);border-left:3px solid var(--gold);padding:10px 13px;font-size:12px;color:var(--muted);line-height:1.7;border-radius:2px;}
.info-bar strong{color:var(--gold2);}
.rst-row{padding:0 16px 20px;text-align:center;}
.btn-rst{background:none;border:1px solid var(--s4);color:var(--dim);padding:10px 20px;font-size:10px;letter-spacing:2px;cursor:pointer;border-radius:4px;}
</style>
</head>
<body>
<div id="screen-today"></div>
<div id="screen-cal" class="hidden"></div>
<div id="screen-progress" class="hidden"></div>
<div id="action-bar" class="hidden"></div>
<div id="timer-overlay" class="hidden">
  <div class="t-lbl" id="t-lbl">DESCANSO</div>
  <div class="t-ring">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle class="t-bg" cx="100" cy="100" r="88"/>
      <circle id="t-arc" class="t-fg" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="t-digits" id="t-dig">2:00</div>
  </div>
  <div class="t-presets">
    <button class="t-preset" onclick="setTimer(60)">1 min</button>
    <button class="t-preset" onclick="setTimer(90)">90 s</button>
    <button class="t-preset active" onclick="setTimer(120)">2 min</button>
    <button class="t-preset" onclick="setTimer(180)">3 min</button>
  </div>
  <button class="t-close" onclick="closeTimer()">✕ CERRAR</button>
</div>
<div id="notif-overlay" class="hidden">
  <div class="notif-box">
    <button class="notif-close" onclick="dismissNotif()">✕</button>
    <div class="notif-em" id="n-em"></div>
    <div class="notif-msg" id="n-msg"></div>
    <div class="notif-sub" id="n-sub"></div>
    <div class="notif-btns">
      <button class="n-rest" onclick="notifRest()">💤 Descanso</button>
      <button class="n-go" onclick="dismissNotif()">🔥 VAMOS</button>
    </div>
  </div>
</div>
<div id="dp-bg" onclick="closeDp()"></div>
<div id="dp"><div class="dp-drag"></div><div id="dp-body"></div><button class="dp-close" onclick="closeDp()">CERRAR</button></div>
<nav id="nav">
  <button class="nb active" id="tab-today" onclick="sw('today')"><span class="ic">⚡</span><span>Hoy</span></button>
  <button class="nb" id="tab-cal" onclick="sw('cal')"><span class="ic">📅</span><span>Calendario</span></button>
  <button class="nb" id="tab-progress" onclick="sw('progress')"><span class="ic">📈</span><span>Progreso</span></button>
</nav>
<script>
const WP=[{block:'FUERZA',pct:.80,sets:4,reps:5},{block:'FUERZA',pct:.83,sets:4,reps:4},{block:'FUERZA',pct:.87,sets:4,reps:3},{block:'DELOAD',pct:.65,sets:3,reps:5},{block:'HIPERTROFIA',pct:.70,sets:4,reps:8},{block:'HIPERTROFIA',pct:.75,sets:4,reps:7},{block:'HIPERTROFIA',pct:.78,sets:4,reps:6},{block:'DELOAD',pct:.60,sets:3,reps:8},{block:'PEAK',pct:.87,sets:4,reps:3},{block:'PEAK',pct:.92,sets:3,reps:2},{block:'PEAK',pct:.95,sets:3,reps:1},{block:'TEST 1RM',pct:.70,sets:3,reps:3}];
const SD={
  A:{name:'Sesión A',emoji:'🏋️',focus:'Squat · Empuje · Jalón',exercises:[
    {id:'squat',name:'Sentadilla trasera',type:'big',liftId:'squat',color:'var(--red)',emoji:'🏋️',note:'Profundidad completa',ts:180},
    {id:'bench',name:'Press banca plano',type:'big',liftId:'bench',color:'var(--blue)',emoji:'💪',note:'Bajada 3s',ts:90},
    {id:'ohp',name:'Press militar barra',type:'big',liftId:'ohp',color:'var(--purple)',emoji:'🔼',note:'De pie, core activo',ts:90},
    {id:'row_bar',name:'Remo con barra',type:'acc',sets:4,reps:'6–8',rest:'90s',note:'Agarre prono',ts:90},
    {id:'curl',name:'Curl bíceps alterno',type:'acc',sets:3,reps:'10–12',rest:'60s',note:'Mancuernas',ts:60},
    {id:'ab_wheel',name:'Rueda abdominal',type:'core',sets:3,reps:'8–10',rest:'60s',ts:60},
    {id:'plank',name:'Plancha frontal',type:'core',sets:3,reps:'30–45s',rest:'45s',ts:45}
  ]},
  B:{name:'Sesión B',emoji:'⚡',focus:'Peso Muerto · Push · Pull',exercises:[
    {id:'deadlift',name:'Peso muerto convencional',type:'big',liftId:'deadlift',color:'var(--gold)',emoji:'⚡',note:'Espalda neutra',ts:180},
    {id:'pullup',name:'Dominadas agarre prono',type:'acc',sets:4,reps:'6–8',rest:'90s',note:'Lastradas',ts:90},
    {id:'inc_press',name:'Press inclinado mancuernas',type:'acc',sets:3,reps:'8–10',rest:'75s',note:'30–45°',ts:75},
    {id:'dips',name:'Fondos en paralelas',type:'acc',sets:3,reps:'8–10',rest:'75s',note:'Lastrados',ts:75},
    {id:'tricep',name:'Extensión tríceps polea',type:'acc',sets:3,reps:'10–12',rest:'60s',note:'Cuerda',ts:60},
    {id:'hang_raise',name:'Hanging leg raise',type:'core',sets:3,reps:'10–12',rest:'60s',ts:60},
    {id:'dragon',name:'Dragon flag negativa',type:'core',sets:3,reps:'4–6',rest:'75s',note:'Bajada 5s',ts:75}
  ]},
  C:{name:'Sesión C',emoji:'💪',focus:'Unilateral · Hombro · Posterior',exercises:[
    {id:'bulgarian',name:'Sentadilla búlgara',type:'acc',sets:4,reps:'8–10',rest:'90s',note:'Mancuernas c/pierna',ts:90},

const TYPES=['A','B','C','D'];
const NM=[
  {e:'🔥💪',m:'¡HOY TOCA PONERSE MAMADO, FIERA!'},
  {e:'🏋️⚡',m:'¡A MOVER HIERRO, CAMPEÓN!'},
  {e:'💥🎯',m:'¡SIN EXCUSAS HOY, FIERA!'},
  {e:'🦁🔥',m:'¡EL GYM TE LLAMA! VAMOS A POR ELLO'},
  {e:'🚀💪',m:'¡HOY TOCA SUPERAR RÉCORDS!'},
  {e:'⚡🏆',m:'¡EL DOLOR DE HOY ES LA FUERZA DE MAÑANA!'},
  {e:'🐉💯',m:'¡DESPIERTA LA BESTIA QUE LLEVAS DENTRO!'},
  {e:'😤🔥',m:'¡NO HAY DÍAS FÁCILES, SOLO DÍAS QUE TE HACEN MÁS FUERTE!'}
];
const SN={A:{sub:'Sesión A · Squat y press. Día de fuerza pura.'},B:{sub:'Sesión B · Peso muerto. A dejarlo todo en la barra.'},C:{sub:'Sesión C · Hombros y unilateral. Volumen y detalle.'},D:{sub:'Calistenia · Muscle-up, pino y L-sit. Skills day.'}};
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const LS='ev4';

const epley=(w,r)=>r===1?w:w*(1+r/30);
const r25=v=>Math.round(v/2.5)*2.5;
const tgt=(o,p)=>r25(o*p);
const sW=i=>Math.floor(i/4);
const sT=i=>TYPES[i%4];
const sDef=i=>SD[sT(i)];
const sPlan=i=>WP[sW(i)];
const bKey=b=>b.replace(/ /g,'').replace('/','');
const todayS=()=>new Date().toISOString().slice(0,10);
const fmtD=iso=>{if(!iso)return'';return new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});};
const fmtDs=iso=>{if(!iso)return'';return new Date(iso).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});};

function mkSess(){return Array.from({length:48},(_,i)=>({status:i===0?'pending':'locked',date:null,bigLogs:{},checks:{}}));}
function initS(){
  return{oneRMs:{squat:82.5,deadlift:92.5,bench:70,ohp:22.5},cycles:[{num:1,startDate:new Date().toISOString(),sessions:mkSess()}],ci:0,vi:0,tab:'today',calMode:'month',calY:new Date().getFullYear(),calM:new Date().getMonth(),nDis:null};
}
let S=initS();
function load(){try{const s=localStorage.getItem(LS);if(s)S=JSON.parse(s);}catch(e){}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function gc(i){return S.cycles[i!==undefined?i:S.ci];}
function cIdx(){const ss=gc().sessions;const i=ss.findIndex(s=>s.status==='pending');return i;}

function tChk(si,id){gc().sessions[si].checks[id]=!gc().sessions[si].checks[id];save();ra();}
function uBig(si,exId,f,v){const s=gc().sessions[si];if(!s.bigLogs[exId])s.bigLogs[exId]={w:'',r:''};s.bigLogs[exId][f]=v;save();ra();}
function ulNext(i){const ss=gc().sessions;if(i+1<48&&ss[i+1].status==='locked')ss[i+1].status='pending';}
function complete(i){
  const s=gc().sessions[i];
  sDef(i).exercises.filter(e=>e.type==='big').forEach(ex=>{
    const l=s.bigLogs[ex.id]||{};const w=parseFloat(l.w),r=parseFloat(l.r);
    if(w>0&&r>0)S.oneRMs[ex.liftId]=r25(epley(w,r));
  });
  s.status='completed';s.date=new Date().toISOString();ulNext(i);chkCyc();save();ra();
}
function markRest(i){gc().sessions[i].status='rest';gc().sessions[i].date=new Date().toISOString();ulNext(i);chkCyc();save();ra();}
function editS(i){gc().sessions[i].status='pending';const ss=gc().sessions;if(i+1<48&&ss[i+1].status==='pending'&&!ss[i+1].date)ss[i+1].status='locked';save();ra();}
function chkCyc(){const ss=gc().sessions;if(ss.every(s=>s.status==='completed'||s.status==='rest'))newCyc();}
function newCyc(){S.cycles.push({num:S.cycles.length+1,startDate:new Date().toISOString(),sessions:mkSess()});S.ci=S.cycles.length-1;S.vi=S.ci;}
function resetAll(){if(confirm('¿Reiniciar TODO el progreso?')){S=initS();save();ra();}}

function getSessOnDate(ds){
  const res=[];
  S.cycles.forEach((c,ci)=>{c.sessions.forEach((s,si)=>{if(s.date&&s.date.startsWith(ds))res.push({ci,si,s,num:c.num});});});
  return res;
}
function getBlockForDate(ds){
  const f=getSessOnDate(ds);if(!f.length)return null;
  const x=f[0];if(x.s.status==='rest')return'rest';
  const t=sT(x.si);if(t==='D')return'cali';
  return bKey(sPlan(x.si).block);
}

// TIMER
let tInt=null,tTotal=120,tLeft=120;
const CIRC=553;
function openTimer(secs,label){
  tTotal=secs;tLeft=secs;
  document.getElementById('t-lbl').textContent=label||'DESCANSO';
  document.querySelectorAll('.t-preset').forEach(b=>b.classList.remove('active'));
  updateTUI();
  document.getElementById('timer-overlay').classList.remove('hidden');
  if(tInt)clearInterval(tInt);
  tInt=setInterval(tickT,1000);
}
function setTimer(s){tTotal=s;tLeft=s;document.querySelectorAll('.t-preset').forEach(b=>b.classList.remove('active'));updateTUI();if(tInt)clearInterval(tInt);tInt=setInterval(tickT,1000);}
function tickT(){tLeft--;if(tLeft<=0){tLeft=0;clearInterval(tInt);document.getElementById('t-arc').className='t-done';if(navigator.vibrate)navigator.vibrate([300,100,300,100,500]);}updateTUI();}
function updateTUI(){const m=Math.floor(tLeft/60),s=tLeft%60;document.getElementById('t-dig').textContent=m+':'+(s<10?'0':'')+s;const arc=document.getElementById('t-arc');arc.style.strokeDashoffset=CIRC*(1-tLeft/tTotal);arc.className=tLeft>0?'t-fg':'t-done';}
function closeTimer(){if(tInt)clearInterval(tInt);document.getElementById('timer-overlay').classList.add('hidden');}

// NOTIFICATION
function checkNotif(){
  const ci=cIdx();if(ci===-1)return;
  const today=todayS();
  if(S.nDis===today)return;
  const trained=S.cycles.some(c=>c.sessions.some(s=>(s.status==='completed'||s.status==='rest')&&s.date&&s.date.startsWith(today)));
  if(trained)return;
  const nm=NM[Math.floor(Math.random()*NM.length)];
  const t=sT(ci);const sn=SN[t]||{sub:''};
  const plan=sPlan(ci);const wk=sW(ci);const def=sDef(ci);
  document.getElementById('n-em').textContent=nm.e;
  document.getElementById('n-msg').textContent=nm.m;
  document.getElementById('n-sub').textContent=`${def.emoji} ${def.name} · Semana ${wk+1} · ${plan.block}\n${sn.sub}`;
  document.getElementById('notif-overlay').classList.remove('hidden');
}
function dismissNotif(){document.getElementById('notif-overlay').classList.add('hidden');}
function notifRest(){const ci=cIdx();if(ci!==-1)markRest(ci);S.nDis=todayS();save();document.getElementById('notif-overlay').classList.add('hidden');ra();}

function renderToday(){
  const el=document.getElementById('screen-today');

  const sess=cyc.sessions[ci];
  const def=sDef(ci);const plan=sPlan(ci);const wk=sW(ci);

  const bk=bKey(plan.block);
  let h=`<div class="pg-hdr"><h1>MI <span>ENTRENAMIENTO</span></h1><p>Ciclo ${cyc.num} · Semana ${wk+1} de 12</p></div>`;
  h+=`<div class="sess-hdr"><div class="sess-top"><span class="bdg ${bk}">${plan.block}</span>
    <span style="font-size:10px;color:var(--muted)">SEM ${wk+1} · DÍA ${(ci%4)+1}</span></div>
    <div class="sess-title">${def.emoji} ${def.name}</div>
    <div class="sess-focus">${def.focus}</div>
    <div class="sess-info"><span class="chip">${plan.sets}×${plan.reps} @ ${Math.round(plan.pct*100)}%</span>
    ${def.name!=='Calistenia'?`<span class="chip">⏱ ${plan.block==='FUERZA'||plan.block==='PEAK'?'2–3 min':'60–90s'}</span>`:''}</div></div>`;
  if(isDone)h+=`<div class="done-bar"><span class="done-t">✓ Completada · ${fmtD(sess.date)}</span><button class="btn-ed" onclick="editS(${ci})">Editar</button></div>`;
  else if(isRest)h+=`<div class="done-bar rest-bar"><span class="rest-t">💤 Descanso · ${fmtD(sess.date)}</span><button class="btn-ed" onclick="editS(${ci})">Cambiar</button></div>`;
  h+=def.name==='Calistenia'?rCali(ci,sess,ro):rGym(ci,sess,def,plan,ro);
  el.innerHTML=h;
  ab.innerHTML=`<button class="btn-rest" onclick="markRest(${ci})">💤 Descanso</button><button class="btn-done" onclick="complete(${ci})">✓ COMPLETAR SESIÓN</button>`;
  ab.classList.toggle('hidden',ro);
}

function rGym(ci,sess,def,plan,ro){
  let h='';
  const bigs=def.exercises.filter(e=>e.type==='big');
  const accs=def.exercises.filter(e=>e.type==='acc');
  const cores=def.exercises.filter(e=>e.type==='core');
  if(bigs.length){
    h+=`<div class="sec-lbl">BIG LIFTS — ${plan.sets}×${plan.reps} @ ${Math.round(plan.pct*100)}%</div>`;
    bigs.forEach(ex=>{
      const orm=S.oneRMs[ex.liftId]||0,tw=tgt(orm,plan.pct);
      const log=sess.bigLogs[ex.id]||{w:'',r:''};
      const wv=parseFloat(log.w),rv=parseFloat(log.r);
      const nO=wv>0&&rv>0?r25(epley(wv,rv)):null;
      const delta=nO?nO-orm:null;
      h+=`<div class="bl"><div class="bl-top"><span style="font-size:20px">${ex.emoji}</span>
        <div><div class="bl-nm">${ex.name}</div><div class="bl-nt">${ex.note}</div></div></div>
        <div class="bl-tr"><span class="bl-kg" style="color:${ex.color}">${tw}</span><span class="bl-sc"> kg × ${plan.sets}×${plan.reps}</span></div>
        <div class="bl-pc">1RM: ${orm} kg · objetivo al ${Math.round(plan.pct*100)}%</div>`;
      if(!ro){
        h+=`<div class="bl-row">
          <div class="bl-grp"><label>Peso kg</label><input class="bl-in" type="number" inputmode="decimal" step="0.5" placeholder="${tw}" value="${log.w||''}" oninput="uBig(${ci},'${ex.id}','w',this.value)"></div>
          <div class="bl-x">×</div>
          <div class="bl-grp"><label>Reps</label><input class="bl-in" style="width:66px" type="number" inputmode="numeric" placeholder="${plan.reps}" value="${log.r||''}" oninput="uBig(${ci},'${ex.id}','r',this.value)"></div></div>`;
        if(nO)h+=`<div class="bl-pv" style="color:${ex.color}">→ Nuevo 1RM: ${nO} kg (${delta>=0?'+':''}${delta})</div>`;
        h+=`<button class="bl-tbtn" onclick="openTimer(${ex.ts},'${ex.name}')">⏱ INICIAR DESCANSO · ${Math.floor(ex.ts/60)}:${String(ex.ts%60).padStart(2,'0')}</button>`;
      } else if(log.w){
        const diff=r25(parseFloat(log.w)-tw);
        h+=`<div class="bl-pv" style="color:${diff>=0?'var(--green)':'var(--red)'}">Real: ${log.w}kg × ${log.r} (${diff>=0?'+':''}${diff} vs obj)</div>`;
      }
      h+=`</div>`;
    });
  }
  if(accs.length){
    h+=`<div class="sec-lbl">ACCESORIOS</div>`;
    accs.forEach(ex=>{
      const on=!!sess.checks[ex.id];
      h+=`<div class="ex-row"><div class="ex-inf"><div class="ex-nm">${ex.name}</div><div class="ex-sb">${ex.sets}×${ex.reps} · ${ex.rest}${ex.note?' · '+ex.note:''}</div></div>
        ${!ro?`<button class="t-btn" onclick="openTimer(${ex.ts},'Descanso')">⏱</button>`:''}
        ${ro?(on?'<span style="color:var(--green);font-size:18px">✓</span>':''):`<button class="chk ${on?'on':''}" onclick="tChk(${ci},'${ex.id}')">${on?'✓':'○'}</button>`}</div>`;
    });
  }
  if(cores.length){
    h+=`<div class="sec-lbl">CORE · ABDOMINALES</div>`;
    cores.forEach(ex=>{
      const on=!!sess.checks[ex.id];
      h+=`<div class="ex-row"><div class="ex-inf"><div class="ex-nm">${ex.name}</div><div class="ex-sb">${ex.sets}×${ex.reps} · ${ex.rest}${ex.note?' · '+ex.note:''}</div></div>
        ${!ro?`<button class="t-btn" onclick="openTimer(${ex.ts},'Core')">⏱</button>`:''}
        ${ro?(on?'<span style="color:var(--green);font-size:18px">✓</span>':''):`<button class="chk ${on?'on':''}" onclick="tChk(${ci},'${ex.id}')">${on?'✓':'○'}</button>`}</div>`;
    });
  }
  h+=`<div style="height:80px"></div>`;
  return h;
}

function rCali(ci,sess,ro){
  const def=SD['D'];
  const blocks=[...new Set(def.exercises.map(e=>e.block))];
  let h='';
  blocks.forEach(blk=>{
    h+=`<div class="cb-hdr"><div class="cb-t">${blk}</div></div>`;
    def.exercises.filter(e=>e.block===blk).forEach(ex=>{
      const on=!!sess.checks[ex.id];
      const sc=ex.reps?`${ex.sets}×${ex.reps}`:`${ex.sets}`;
      h+=`<div class="ex-row"><div class="ex-inf"><div class="ex-nm">${ex.name}</div><div class="ex-sb">${sc}</div></div>
        ${!ro?`<button class="t-btn" onclick="openTimer(${ex.ts},'Skills')">⏱</button>`:''}
        ${ro?(on?'<span style="color:var(--green);font-size:18px">✓</span>':''):`<button class="chk ${on?'on':''}" onclick="tChk(${ci},'${ex.id}')">${on?'✓':'○'}</button>`}</div>`;
    });
  });
  h+=`<div style="height:80px"></div>`;
  return h;
}

  });

function rMonth(y,m){
  const now=new Date();
  const firstDay=new Date(y,m,1);
  const dim=new Date(y,m+1,0).getDate();
  let sd=firstDay.getDay();if(sd===0)sd=7;sd--;
  let h=`<div class="cal-dow">`;
  ['Lu','Ma','Mi','Ju','Vi','Sa','Do'].forEach(d=>{h+=`<span>${d}</span>`;});
  h+=`</div><div class="cal-grid">`;
  const prev=new Date(y,m,0).getDate();
  for(let i=sd-1;i>=0;i--){
    const d=prev-i,m2=m-1<0?11:m-1,y2=m-1<0?y-1:y;
    const ds=`${y2}-${String(m2+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bl=getBlockForDate(ds);
    h+=`<div class="cal-day other" onclick="showDp('${ds}')"><div class="cal-dn">${d}</div>${bl?`<div class="cal-dot dot-${bl}"></div>`:''}</div>`;
  }
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isT=ds===todayS();
    const bl=getBlockForDate(ds);
    h+=`<div class="cal-day ${isT?'today':''}" onclick="showDp('${ds}')"><div class="cal-dn">${d}</div>${bl?`<div class="cal-dot dot-${bl}"></div>`:''}</div>`;
  }
  const total=sd+dim,nxt=(7-total%7)%7;
  for(let d=1;d<=nxt;d++){
    const m2=m+1>11?0:m+1,y2=m+1>11?y+1:y;
    const ds=`${y2}-${String(m2+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bl=getBlockForDate(ds);
    h+=`<div class="cal-day other" onclick="showDp('${ds}')"><div class="cal-dn">${d}</div>${bl?`<div class="cal-dot dot-${bl}"></div>`:''}</div>`;
  }
  h+=`</div>`;
  return h;
}

function rYear(y){
  let h=`<div class="yr-grid">`;
  for(let m=0;m<12;m++){
    const fd=new Date(y,m,1);const dim=new Date(y,m+1,0).getDate();
    let sd=fd.getDay();if(sd===0)sd=7;sd--;
    h+=`<div class="yr-m"><div class="yr-mt">${MS[m]}</div><div class="yr-mg">`;
    for(let i=0;i<sd;i++)h+=`<div class="yr-c"></div>`;
    for(let d=1;d<=dim;d++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isT=ds===todayS();
      const bl=getBlockForDate(ds);
      h+=`<div class="yr-c ${isT?'today-c':bl&&bl!=='rest'?'trained':''}"></div>`;
    }
    h+=`</div></div>`;
  }
  h+=`</div>`;
  return h;
}

function calNav(d){
  if(S.calMode==='month'){S.calM+=d;if(S.calM<0){S.calM=11;S.calY--;}if(S.calM>11){S.calM=0;S.calY++;}}
  else S.calY+=d;
  save();ra();
}
function setCalMode(m){S.calMode=m;save();ra();}

function showDp(ds){
  const label=fmtDs(ds+'T12:00:00');
  const sessions=getSessOnDate(ds);
  let h=`<div class="dp-date">${label}</div>`;
  if(!sessions.length){h+=`<div class="dp-empty">Sin entrenamiento registrado.</div>`;}
  else{
    sessions.forEach(({si,s,num})=>{
      const def=sDef(si),plan=sPlan(si),bk=bKey(plan.block);
      const bigs=def.exercises.filter(e=>e.type==='big');
      let det='';
      bigs.forEach(ex=>{const l=s.bigLogs[ex.id]||{};if(l.w)det+=`<div style="font-size:11px;color:var(--muted);margin-top:2px">${ex.emoji} ${ex.name}: ${l.w}kg × ${l.r}</div>`;});
      h+=`<div class="dp-s"><div class="dp-sn">${def.emoji} ${def.name} <span class="bdg ${bk}">${plan.block}</span></div>
        <div class="dp-ss">Ciclo ${num} · Sem ${sW(si)+1} · ${s.status==='rest'?'💤 Descanso':'✓ Completada'}${det}</div></div>`;
    });
  }
  document.getElementById('dp-body').innerHTML=h;
  document.getElementById('dp').classList.add('open');
  document.getElementById('dp-bg').style.display='block';
}
function closeDp(){document.getElementById('dp').classList.remove('open');document.getElementById('dp-bg').style.display='none';}

// RENDER PROGRESS
function renderProgress(){
  const el=document.getElementById('screen-progress');
  const vi=S.vi;const cycle=gc(vi);
  const ci=cIdx();
  const totSess=S.cycles.reduce((a,c)=>a+c.sessions.filter(s=>s.status==='completed').length,0);
  const curPct=Math.round((gc().sessions.filter(s=>s.status!=='locked'&&s.status!=='pending').length/48)*100);
  let h=`<div class="pg-hdr"><h1>MI <span>PROGRESO</span></h1><p>${S.cycles.length} ciclo${S.cycles.length>1?'s':''} · ${totSess} sesiones totales</p></div>`;
  h+=`<div class="stats-row">
    <div class="stat"><div class="stat-v">${totSess}</div><div class="stat-l">Sesiones</div></div>
    <div class="stat"><div class="stat-v">${S.cycles.length}</div><div class="stat-l">Ciclos</div></div>
    <div class="stat"><div class="stat-v">${curPct}%</div><div class="stat-l">Ciclo actual</div></div></div>`;
  h+=`<div class="sec-t">1RM ACTUALES</div>`;
  h+=`<div class="orm-grid">
    <div class="orm-c" data-l="squat"><div class="orm-l">🏋️ Sentadilla</div><div class="orm-v">${S.oneRMs.squat} kg</div><div class="orm-sb">Inicio: 82.5 kg</div></div>
    <div class="orm-c" data-l="deadlift"><div class="orm-l">⚡ Peso Muerto</div><div class="orm-v">${S.oneRMs.deadlift} kg</div><div class="orm-sb">Inicio: 92.5 kg</div></div>
    <div class="orm-c" data-l="bench"><div class="orm-l">💪 Press Banca</div><div class="orm-v">${S.oneRMs.bench} kg</div><div class="orm-sb">Inicio: 70 kg</div></div>
    <div class="orm-c" data-l="ohp"><div class="orm-l">🔼 Press Militar</div><div class="orm-v">${S.oneRMs.ohp} kg</div><div class="orm-sb">Inicio: 22.5 kg</div></div></div>`;
  h+=`<div class="sec-t">CICLOS</div><div class="cyc-sel">`;
  S.cycles.forEach((c,i)=>{h+=`<button class="cyc-btn ${i===vi?'active':''}" onclick="viewCyc(${i})">Ciclo ${c.num}</button>`;});
  h+=`</div>`;
  h+=`<div class="sec-t">PLAN — CICLO ${cycle.num}</div>`;
  h+=`<div class="ptbl-w"><table class="ptbl"><thead><tr><th>Sem</th><th>Bloque</th><th>Esquema</th><th>%</th><th style="color:var(--red)">Squat</th><th style="color:var(--gold)">Muerto</th><th style="color:var(--blue)">Banca</th><th style="color:var(--purple)">OHP</th><th>Est.</th></tr></thead><tbody>`;
  WP.forEach((p,w)=>{
    const si0=w*4;const wS=cycle.sessions.slice(si0,si0+4);
    const wD=wS.filter(s=>s.status!=='locked'&&s.status!=='pending').length;
    const isCur=vi===S.ci&&sW(Math.max(0,ci))===w&&ci>=0;
    const isAll=wD===4;const bk=bKey(p.block);
    h+=`<tr class="${isCur?'cur':isAll?'done':''}">
      <td style="font-weight:700;color:${isCur?'var(--gold)':isAll?'var(--muted)':'var(--dim)'}">${w+1}</td>
      <td><span class="bdg ${bk}">${p.block}</span></td>
      <td>${p.sets}×${p.reps}</td>
      <td style="color:${isCur?'var(--gold)':'var(--dim)'}">${Math.round(p.pct*100)}%</td>
      <td>${tgt(S.oneRMs.squat,p.pct)}kg</td><td>${tgt(S.oneRMs.deadlift,p.pct)}kg</td>
      <td>${tgt(S.oneRMs.bench,p.pct)}kg</td><td>${tgt(S.oneRMs.ohp,p.pct)}kg</td>
      <td style="color:${isAll?'var(--green)':isCur?'var(--gold)':'var(--dim)'}">${isAll?'✓ 4/4':isCur?wD+'/4':'—'}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<div class="info-bar"><strong>Los pesos se recalculan</strong> automáticamente al registrar kg reales en cada sesión. Al terminar el ciclo, los 1RM actualizados pasan al ciclo siguiente.</div>`;
  h+=`<div class="rst-row"><button class="btn-rst" onclick="resetAll()">Reiniciar todo el progreso</button></div><div style="height:16px"></div>`;
  el.innerHTML=h;
}
function viewCyc(i){S.vi=i;save();ra();}

// TAB
function sw(tab){
  S.tab=tab;
  ['today','cal','progress'].forEach(t=>{
    document.getElementById('screen-'+t).classList.toggle('hidden',t!==tab);
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
  });
  if(tab!=='today')document.getElementById('action-bar').classList.add('hidden');
  ra();
}
function ra(){
  if(S.tab==='today')renderToday();
  else if(S.tab==='cal')renderCalendar();
  else renderProgress();
}

// INIT
load();
const _now=new Date();S.calY=_now.getFullYear();S.calM=_now.getMonth();S.vi=S.ci;
ra();
setTimeout(checkNotif,700);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
